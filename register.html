<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inscription - Burundi People Registry</title>

    <link rel="stylesheet" href="register.css">
</head>

<body>

<header>
    <h1>BURUNDI PEOPLE REGISTRY</h1>
    <p>Enregistrement d'une personne</p>
</header>


<nav>
    <a href="index.html">Accueil</a>
    <a href="inscription.html">Inscription</a>
    <a href="liste.html">Liste</a>
    <a href="manager.html">Manager</a>

    <button id="btnDeconnexion">
        Déconnexion
    </button>
</nav>


<main>

    <section>

        <h2 id="titreFormulaire">
            Enregistrer une personne
        </h2>

        <form id="personForm">

            <input
                type="hidden"
                id="personId"
            >


            <div class="form-grid">

                <!-- NOM -->

                <div class="form-group">

                    <label for="nom">
                        Nom *
                    </label>

                    <input
                        type="text"
                        id="nom"
                        required
                    >

                </div>


                <!-- PRENOM -->

                <div class="form-group">

                    <label for="prenom">
                        Prénom *
                    </label>

                    <input
                        type="text"
                        id="prenom"
                        required
                    >

                </div>


                <!-- SEXE -->

                <div class="form-group">

                    <label for="sexe">
                        Sexe *
                    </label>

                    <select
                        id="sexe"
                        required
                    >

                        <option value="">
                            -- Choisir --
                        </option>

                        <option value="Masculin">
                            Masculin
                        </option>

                        <option value="Féminin">
                            Féminin
                        </option>

                    </select>

                </div>


                <!-- DATE DE NAISSANCE -->

                <div class="form-group">

                    <label for="dateNaissance">
                        Date de naissance
                    </label>

                    <input
                        type="date"
                        id="dateNaissance"
                    >

                </div>


                <!-- CARTE -->

                <div class="form-group">

                    <label for="identite">
                        Numéro de carte d'identité
                    </label>

                    <input
                        type="text"
                        id="identite"
                    >

                </div>


                <!-- TELEPHONE -->

                <div class="form-group">

                    <label for="telephone">
                        Téléphone
                    </label>

                    <input
                        type="tel"
                        id="telephone"
                        placeholder="+257..."
                    >

                </div>


                <!-- PROVINCE -->

                <div class="form-group">

                    <label for="province">
                        Province *
                    </label>

                    <select
                        id="province"
                        required
                    >

                        <option value="">
                            -- Choisir une province --
                        </option>

                        <option value="buhumuza">
                            Buhumuza
                        </option>

                        <option value="bujumbura">
                            Bujumbura
                        </option>

                        <option value="burunga">
                            Burunga
                        </option>

                        <option value="butanyerera">
                            Butanyerera
                        </option>

                        <option value="gitega">
                            Gitega
                        </option>

                    </select>

                </div>


                <!-- COMMUNE -->

                <div class="form-group">

                    <label for="commune">
                        Commune *
                    </label>

                    <select
                        id="commune"
                        required
                    >

                        <option value="">
                            -- Choisir d'abord une province --
                        </option>

                    </select>

                </div>


                <!-- ZONE -->

                <div class="form-group">

                    <label for="zone">
                        Zone
                    </label>

                    <input
                        type="text"
                        id="zone"
                        placeholder="Nom de la zone"
                    >

                </div>


                <!-- COLLINE -->

                <div class="form-group">

                    <label for="colline">
                        Colline
                    </label>

                    <input
                        type="text"
                        id="colline"
                        placeholder="Nom de la colline"
                    >

                </div>


                <!-- SOUS-COLLINE -->

                <div class="form-group">

                    <label for="sousColline">
                        Sous-colline
                    </label>

                    <input
                        type="text"
                        id="sousColline"
                        placeholder="Nom de la sous-colline"
                    >

                </div>


                <!-- ADRESSE -->

                <div class="form-group">

                    <label for="adresse">
                        Adresse
                    </label>

                    <textarea
                        id="adresse"
                        rows="3"
                        placeholder="Adresse complète"
                    ></textarea>

                </div>

            </div>


            <div class="buttons">

                <button
                    type="submit"
                    id="saveButton"
                    class="btn-save"
                >
                    Enregistrer
                </button>


                <button
                    type="button"
                    id="btnNouveau"
                    class="btn-reset"
                >
                    Nouveau
                </button>

            </div>


            <p
                id="message"
                class="message"
            ></p>

        </form>

    </section>

</main>


<footer>

    <p>
        © 2026 Burundi People Registry
    </p>

</footer>


<script src="register.js"></script>

</body>
</html>
